plugins {
    id 'java'
    id 'io.qameta.allure' version '2.12.0'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}
ext {
    lombokVersion = '1.18.36'
    allureVersion = '2.28.0'
}
dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-api', version: '5.11.4'
    testImplementation group: 'io.rest-assured', name: 'rest-assured', version: '5.5.0'
    compileOnly group: 'org.projectlombok', name: 'lombok', version: '1.18.36'
    implementation group: 'org.projectlombok', name: 'lombok-mapstruct-binding', version: '0.2.0'
    compileOnly group: 'org.projectlombok', name: 'lombok-maven-plugin', version: '1.18.20.0'
    implementation group: 'io.freefair.gradle', name: 'lombok-plugin', version: '8.12.1'
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.18.2'
    implementation group: 'org.seleniumhq.selenium', name: 'selenium-java', version: '4.28.1'
    testImplementation group: 'org.assertj', name: 'assertj-core', version: '3.27.3'
    implementation group: 'org.aeonbits.owner', name: 'owner', version: '1.0.12'
    testImplementation group: 'io.qameta.allure', name: 'allure-junit5', version: '2.29.1'
    implementation group: 'io.qameta.allure', name: 'allure-rest-assured', version: '2.29.1'


}

test {
    useJUnitPlatform()
    systemProperties(System.getProperties())
}